<?xml version="1.0" encoding="UTF-8"?>
<svg id="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-labelledby="arch-title"><title id="arch-title">Simplified architecture of the Autonomous ML Engineer Crew</title><rect width="100%" height="100%" fill="#ffffff"/><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;display=swap');#arch {
  --bg: #f4f6f8; --sheet: #ffffff; --band: #eaeef2; --ink: #16202a; --muted: #56636f; --rule: #d3d9df;
  --crew: #4450c4; --adk: #0d7f73; --mcp: #a86a12; --llm: #a82c6f; --guard: #c0461b; --slate: #4a5866; --store: #5d6b7a;
  --crew-t: #e8eafb; --adk-t: #e1f3f0; --mcp-t: #f8eedc; --llm-t: #f7e4ee; --guard-t: #fbe9e1; --slate-t: #e9edf1; --store-t: #edf0f3;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
} #arch { background: var(--sheet); }
#arch text { font-family: var(--body); fill: var(--ink); }
#arch .band { fill: var(--band); }
#arch .stitle { font-weight: 600; font-size: 16px; }
#arch .dtitle { font-family: var(--display); font-weight: 700; font-size: 24px; }
#arch .sline { font-size: 13.5px; fill: var(--muted); }
#arch .lbl { font-size: 13px; font-weight: 600; }
#arch .flow { fill: var(--band); stroke: var(--crew); stroke-width: 1.4; }
#arch .bandnum { font-family: var(--mono); font-size: 12px; fill: var(--muted); letter-spacing: .08em; }
#arch .bandname { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .06em; }
#arch .bandsub { font-size: 11.5px; fill: var(--muted); }
#arch .box { fill: var(--sheet); stroke-width: 1.6; }
#arch .dash { stroke-dasharray: 6 4; }
#arch .flow { fill: none; stroke: var(--crew); stroke-width: 1.4; stroke-dasharray: 2 0; opacity: .9; }
#arch .btitle { font-weight: 600; font-size: 14px; }
#arch .big { font-family: var(--display); font-size: 17px; font-weight: 700; }
#arch .small { font-size: 12px; fill: var(--muted); }
#arch .mono { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
#arch .ctitle { font-weight: 600; font-size: 13px; }
#arch .label, #arch .label2 { font-size: 11.5px; font-weight: 500; }
#arch .label2 { font-weight: 400; fill: var(--muted); font-size: 11px; }
#arch .halo { stroke: var(--band); stroke-width: 7px; stroke-linejoin: round; paint-order: stroke; fill: var(--band); }
#arch .pilltxt { font-family: var(--mono); font-size: 11px; font-weight: 500; }
#arch .chip { fill: var(--slate-t); }
#arch .chainbox { fill: var(--llm-t); }
#arch .rule { stroke: var(--rule); stroke-width: 1; }
#arch .arr, #arch .arr-llm { fill: none; stroke: var(--ink); stroke-width: 1.5; }
#arch .arr-llm { stroke: var(--llm); }
#arch .loop { fill: none; stroke: var(--guard); stroke-width: 1.6; stroke-dasharray: 5 4; }
#arch .mcp-a { fill: none; stroke: var(--mcp); stroke-width: 1.8; }
#arch .a2a { fill: none; stroke: var(--adk); stroke-width: 2.2; }
#arch .mk-arr { fill: var(--ink); } #arch .mk-loop { fill: var(--guard); } #arch .mk-mcp-a { fill: var(--mcp); }
#arch .mk-a2a { fill: var(--adk); } #arch .mk-arr-llm { fill: var(--llm); }
#arch .dot-llm { fill: var(--llm); }
#arch .sw { stroke-width: 1.6; }
#arch .st-crew { stroke: var(--crew); } #arch .sw.st-crew { fill: var(--crew-t); }
#arch .st-adk { stroke: var(--adk); } #arch .sw.st-adk { fill: var(--adk-t); }
#arch .st-mcp { stroke: var(--mcp); } #arch .sw.st-mcp { fill: var(--mcp-t); }
#arch .st-llm { stroke: var(--llm); } #arch .sw.st-llm { fill: var(--llm-t); }
#arch .st-guard { stroke: var(--guard); } #arch .sw.st-guard { fill: var(--guard-t); }
#arch .st-slate { stroke: var(--slate); }
#arch .st-store { stroke: var(--store); } #arch .sw.st-store { fill: var(--store-t); }
#arch .pill-crew { fill: var(--crew-t); } #arch .ink-crew { fill: var(--crew); }
#arch .pill-adk { fill: var(--adk-t); } #arch .ink-adk { fill: var(--adk); }
#arch .pill-mcp { fill: var(--mcp-t); } #arch .ink-mcp { fill: var(--mcp); }
#arch .pill-llm { fill: var(--llm-t); } #arch .ink-llm { fill: var(--llm); }
#arch .pill-guard { fill: var(--guard-t); } #arch .ink-guard { fill: var(--guard); }
#arch .pill-slate { fill: var(--slate-t); } #arch .ink-slate { fill: var(--slate); }
#arch .pill-store { fill: var(--store-t); } #arch .ink-store { fill: var(--store); }</style><defs><marker id="ah-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-arr"/></marker><marker id="ah-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-loop"/></marker></defs><text x="40" y="46" class="dtitle" text-anchor="start">Autonomous ML Engineer Crew</text><text x="1160" y="46" class="sline" text-anchor="end">dataset + target + goal  →  tested, deployed model</text><rect x="110" y="78" width="250" height="82" rx="12" class="box st-slate"/><text x="126" y="108" class="stitle" text-anchor="start">User</text><text x="126" y="130" class="sline" text-anchor="start">uploads a CSV, picks the target</text><rect x="475" y="78" width="250" height="82" rx="12" class="box st-slate"/><text x="491" y="108" class="stitle" text-anchor="start">Web dashboard</text><text x="491" y="130" class="sline" text-anchor="start">React · charts · predict form</text><rect x="840" y="78" width="250" height="82" rx="12" class="box st-slate"/><text x="856" y="108" class="stitle" text-anchor="start">API server</text><text x="856" y="130" class="sline" text-anchor="start">FastAPI · runs the pipeline</text><path d="M360,119 H471" class="arr" marker-end="url(#ah-arr)"/><path d="M725,119 H836" class="arr" marker-end="url(#ah-arr)"/><path d="M965,160 V226" class="arr" marker-end="url(#ah-arr)"/><rect x="40" y="230" width="1120" height="236" rx="16" class="flow"/><text x="60" y="262" class="stitle big" text-anchor="start">CrewAI Flow</text><text x="176" y="262" class="sline" text-anchor="start">the orchestrator: runs the agents in order and decides what happens next</text><rect x="60" y="300" width="190" height="100" rx="12" class="box st-guard"/><rect x="183.6" y="290" width="54.400000000000006" height="20" rx="10" class="pill-guard"/><text x="210.8" y="304.5" class="pilltxt ink-guard" text-anchor="middle">safety</text><text x="76" y="330" class="stitle" text-anchor="start">Input guardrails</text><text x="76" y="352" class="sline" text-anchor="start">blocks unsafe or</text><text x="76" y="370" class="sline" text-anchor="start">invalid input</text><rect x="282" y="300" width="190" height="100" rx="12" class="box st-crew"/><rect x="405.6" y="290" width="54.400000000000006" height="20" rx="10" class="pill-crew"/><text x="432.8" y="304.5" class="pilltxt ink-crew" text-anchor="middle">CrewAI</text><text x="298" y="330" class="stitle" text-anchor="start">Data-Prep Agent</text><text x="298" y="352" class="sline" text-anchor="start">cleans the data</text><text x="298" y="370" class="sline" text-anchor="start">and splits it</text><rect x="504" y="300" width="190" height="100" rx="12" class="box st-adk"/><rect x="563.6" y="290" width="118.4" height="20" rx="10" class="pill-adk"/><text x="622.8000000000001" y="304.5" class="pilltxt ink-adk" text-anchor="middle">Google ADK · A2A</text><text x="520" y="330" class="stitle" text-anchor="start">Model-Selection</text><text x="520" y="352" class="sline" text-anchor="start">picks + trains</text><text x="520" y="370" class="sline" text-anchor="start">the best model</text><rect x="726" y="300" width="190" height="100" rx="12" class="box st-crew"/><rect x="849.6" y="290" width="54.400000000000006" height="20" rx="10" class="pill-crew"/><text x="876.8000000000001" y="304.5" class="pilltxt ink-crew" text-anchor="middle">CrewAI</text><text x="742" y="330" class="stitle" text-anchor="start">Evaluation Agent</text><text x="742" y="352" class="sline" text-anchor="start">tests the model</text><text x="742" y="370" class="sline" text-anchor="start">on unseen data</text><rect x="948" y="300" width="190" height="100" rx="12" class="box st-crew"/><rect x="1071.6" y="290" width="54.400000000000006" height="20" rx="10" class="pill-crew"/><text x="1098.8" y="304.5" class="pilltxt ink-crew" text-anchor="middle">CrewAI</text><text x="964" y="330" class="stitle" text-anchor="start">Deployment Agent</text><text x="964" y="352" class="sline" text-anchor="start">serves the model at</text><text x="964" y="370" class="sline" text-anchor="start">/predict + monitors it</text><path d="M250,350.0 H278" class="arr" marker-end="url(#ah-arr)"/><path d="M472,350.0 H500" class="arr" marker-end="url(#ah-arr)"/><path d="M694,350.0 H722" class="arr" marker-end="url(#ah-arr)"/><path d="M916,350.0 H944" class="arr" marker-end="url(#ah-arr)"/><path d="M821.0,400 V430 H599.0 V404" class="loop" marker-end="url(#ah-loop)"/><text x="710.0" y="450" class="lbl ink-guard halo" text-anchor="middle">not good enough → try again with feedback (max 2)</text><text x="710.0" y="450" class="lbl ink-guard" text-anchor="middle">not good enough → try again with feedback (max 2)</text><text x="40" y="504" class="stitle" text-anchor="start">Shared services used by the agents</text><rect x="40.0" y="520" width="260" height="86" rx="12" class="box st-llm"/><text x="56.0" y="550" class="stitle" text-anchor="start">LLMs</text><text x="56.0" y="572" class="sline" text-anchor="start">Gemini → Ollama → OpenRouter,</text><text x="56.0" y="590" class="sline" text-anchor="start">with a cache and a safe fallback</text><rect x="326.6666666666667" y="520" width="260" height="86" rx="12" class="box st-mcp"/><text x="342.6666666666667" y="550" class="stitle" text-anchor="start">MCP tools</text><text x="342.6666666666667" y="572" class="sline" text-anchor="start">profile_dataset: reads the data</text><text x="342.6666666666667" y="590" class="sline" text-anchor="start">log_experiment: logs each model</text><rect x="613.3333333333334" y="520" width="260" height="86" rx="12" class="box st-store"/><text x="629.3333333333334" y="550" class="stitle" text-anchor="start">MLflow</text><text x="629.3333333333334" y="572" class="sline" text-anchor="start">records every model tried,</text><text x="629.3333333333334" y="590" class="sline" text-anchor="start">its settings and scores</text><rect x="900.0" y="520" width="260" height="86" rx="12" class="box st-store"/><text x="916.0" y="550" class="stitle" text-anchor="start">Langfuse</text><text x="916.0" y="572" class="sline" text-anchor="start">traces every step of a run,</text><text x="916.0" y="590" class="sline" text-anchor="start">with tokens and cost</text><rect x="40" y="638" width="14" height="14" rx="3" class="sw st-crew"/><text x="62" y="650" class="sline" text-anchor="start">CrewAI agent</text><rect x="180.4" y="638" width="14" height="14" rx="3" class="sw st-adk"/><text x="202.4" y="650" class="sline" text-anchor="start">Google ADK agent (over A2A)</text><rect x="428.8" y="638" width="14" height="14" rx="3" class="sw st-guard"/><text x="450.8" y="650" class="sline" text-anchor="start">safety check</text><rect x="569.2" y="638" width="14" height="14" rx="3" class="sw st-llm"/><text x="591.2" y="650" class="sline" text-anchor="start">LLM</text><rect x="644.8000000000001" y="638" width="14" height="14" rx="3" class="sw st-mcp"/><text x="666.8000000000001" y="650" class="sline" text-anchor="start">MCP tool</text><rect x="756.4000000000001" y="638" width="14" height="14" rx="3" class="sw st-store"/><text x="778.4000000000001" y="650" class="sline" text-anchor="start">app / tracking</text></svg>