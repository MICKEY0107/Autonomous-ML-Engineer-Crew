[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autonomous-ml-engineer-crew"
version = "0.1.0"
description = "A typed multi-agent pipeline for autonomous tabular ML engineering."
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15,<2",
    "fastapi>=0.115,<1",
    "google-adk[a2a]>=2.12,<3",
    "langfuse>=4.7,<5",
    "mcp>=1.28.1,<2",
    "mlflow>=3.5,<4",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pandas>=2.2,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "tools", "agents", "orchestrator"]
